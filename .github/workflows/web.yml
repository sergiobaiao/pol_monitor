# Edição web (Cloudflare Python Worker): publica no Worker a cada push em main que mexa nela e em tags vX.Y.Z.
# Segredos do repositório: CLOUDFLARE_API_TOKEN (permissão "Edit Cloudflare Workers") e CLOUDFLARE_ACCOUNT_ID.
name: Web

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["app-web.py", "wrangler.toml", ".wranglerignore", "smtp-worker/**", ".github/workflows/web.yml"]
  workflow_dispatch:

concurrency:
  group: web-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Checar sintaxe
        run: python3 -m py_compile app-web.py

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Testar o cliente SMTP do Worker auxiliar
        run: node smtp-worker/test.mjs

      - name: Deploy no Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Segredo CLOUDFLARE_API_TOKEN não configurado no repositório"; exit 1
          fi
          # Segredo colado via pipe do PowerShell vem com CRLF/BOM invisíveis, que quebram o wrangler
          export CLOUDFLARE_API_TOKEN="$(printf %s "$CLOUDFLARE_API_TOKEN" | LC_ALL=C tr -cd 'A-Za-z0-9_-')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf %s "$CLOUDFLARE_ACCOUNT_ID" | LC_ALL=C tr -cd 'A-Za-z0-9_-')"
          echo "account id: ${#CLOUDFLARE_ACCOUNT_ID} caracteres válidos"
          # O Worker auxiliar (SMTP com TLS) vai primeiro: o principal o referencia por service binding
          npx --yes wrangler@4 deploy -c smtp-worker/wrangler.toml
          npx --yes wrangler@4 deploy --message "${GITHUB_REF_NAME} ${GITHUB_SHA::7}"
