name = "pol-adv-web"
main = "app-web.py"
compatibility_date = "2026-10-01"
compatibility_flags = ["python_workers", "disable_python_external_sdk"]  # usa o SDK `workers` embutido (sem pywrangler)

# Execução automática em background na borda da Cloudflare (Crons)
[triggers]
crons = ["*/5 * * * *"] # Monitor 24h: a cada 5 min; cada usuário respeita o próprio intervalo de checagem

# Persistência de usuários/sessões/refresh tokens (sem ela cada requisição começa vazia: o login "Lembrar"
# some e o cron não tem usuários para notificar). Sem `id`, o wrangler cria o namespace no primeiro deploy
# e passa a usá-lo nos seguintes (provisionamento automático).
[[kv_namespaces]]
binding = "POL_STORE"

# Envio de e-mail por SMTP com TLS: Worker JavaScript `pol-adv-smtp` (smtp-worker/), chamado por RPC.
# O Python Worker ainda não faz TLS em sockets. Precisa estar publicado antes deste (o web.yml faz nessa ordem).
[[services]]
binding = "SMTP"
service = "pol-adv-smtp"
entrypoint = "Smtp"
